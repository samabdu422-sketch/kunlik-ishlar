<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kunlik ishlar</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1f2430;--mu:#7b8294;--ac:#3b6cf6;--ok:#22a06b;--bd:#e3e6ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161b;--card:#1d2027;--tx:#eceef3;--mu:#8b93a6;--ac:#6b93ff;--ok:#3ec28a;--bd:#2c3039}}
:root[data-theme="dark"]{--bg:#14161b;--card:#1d2027;--tx:#eceef3;--mu:#8b93a6;--ac:#6b93ff;--ok:#3ec28a;--bd:#2c3039}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.w{max-width:640px;margin:0 auto;padding:18px 14px 60px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.nav h1{font-size:19px;margin:0;text-align:center;flex:1}
.nav small{display:block;color:var(--mu);font-weight:400;font-size:13px}
.ib{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px;color:var(--mu);font-weight:600}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.add{display:flex;gap:8px}
input[type=text],textarea{flex:1;width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer;white-space:nowrap}
.btn.g{background:none;color:var(--mu);border:1px solid var(--bd);font-size:13px;padding:7px 12px}
.t{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.t:last-child{border:0}
.t input{width:20px;height:20px;accent-color:var(--ok);flex:none}
.t span{flex:1;word-break:break-word}
.t.done span{text-decoration:line-through;color:var(--mu)}
.t em{font-style:normal;font-size:12px;color:var(--ok)}
.t button{background:none;border:0;color:var(--mu);font-size:16px;cursor:pointer}
.empty{color:var(--mu);text-align:center;padding:12px;font-size:14px}
.h{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);cursor:pointer;font-size:14px}
.h:last-child{border:0}
.h b{color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="w">
  <div class="nav">
    <button class="ib" id="prev">‹</button>
    <h1 id="dt"></h1>
    <button class="ib" id="next">›</button>
  </div>

  <div class="card">
    <div class="add"><input type="text" id="in" placeholder="Yangi ish qoʻshish…"><button class="btn" id="addb">Qoʻshish</button></div>
    <div class="bar"><i id="pb"></i></div>
    <div class="row" style="justify-content:space-between;align-items:center">
      <span id="pt" style="font-size:13px;color:var(--mu)"></span>
      <button class="btn g" id="carry">Oldingi kundan olish</button>
    </div>
  </div>

  <div class="card"><h2>📝 Bajariladigan ishlar</h2><div id="todo"></div></div>
  <div class="card"><h2>✅ Qilingan ishlar</h2><div id="done"></div></div>
  <div class="card"><h2>💭 Kun xulosasi</h2><textarea id="note" placeholder="Bugun nimalar qildim, nimani oʻrgandim…"></textarea></div>
  <div class="card"><h2>📅 Oxirgi 7 kun</h2><div id="hist"></div></div>
  <div class="row" style="align-items:center"><button class="btn g" id="exp">Hammasini nusxalash</button></div>
</div>
<script>
const $=id=>document.getElementById(id);
let db={},cur=key(new Date());
try{db=JSON.parse(localStorage.getItem('kunlik')||'{}')}catch(e){db={}}
let col=null;
function push(k){if(col&&db[k])col.doc('d-'+k).set({k:k,tasks:db[k].tasks,note:db[k].note||''}).catch(()=>{})}
function save(){try{localStorage.setItem('kunlik',JSON.stringify(db))}catch(e){}push(cur)}
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dobj(k){const[a,b,c]=k.split('-');return new Date(+a,+b-1,+c)}
function shift(k,n){const d=dobj(k);d.setDate(d.getDate()+n);return key(d)}
function day(k){return db[k]||(db[k]={tasks:[],note:''})}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function hm(t){return new Date(t).toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'})}
function long(k){return dobj(k).toLocaleDateString('uz-UZ',{day:'numeric',month:'long',weekday:'long'})}
function render(){
  const d=day(cur),isT=cur===key(new Date());
  $('dt').innerHTML=(isT?'Bugun':long(cur))+'<small>'+(isT?long(cur):dobj(cur).getFullYear())+'</small>';
  const open=d.tasks.filter(t=>!t.done),dn=d.tasks.filter(t=>t.done);
  const row=t=>`<div class="t ${t.done?'done':''}"><input type="checkbox" data-c="${t.id}" ${t.done?'checked':''}><span>${esc(t.text)}</span>${t.done?`<em>${hm(t.at)}</em>`:''}<button data-x="${t.id}">✕</button></div>`;
  $('todo').innerHTML=open.length?open.map(row).join(''):'<div class="empty">Hamma ish bajarildi yoki hali qoʻshilmagan</div>';
  $('done').innerHTML=dn.length?dn.sort((a,b)=>b.at-a.at).map(row).join(''):'<div class="empty">Hali hech narsa bajarilmadi</div>';
  const p=d.tasks.length?Math.round(dn.length/d.tasks.length*100):0;
  $('pb').style.width=p+'%';
  $('pt').textContent=dn.length+' / '+d.tasks.length+' bajarildi ('+p+'%)';
  if(document.activeElement!==$('note'))$('note').value=d.note;
  const ks=[];for(let i=0;i<7;i++)ks.push(shift(key(new Date()),-i));
  $('hist').innerHTML=ks.map(k=>{const x=db[k]||{tasks:[]};return `<div class="h" data-k="${k}"><span>${long(k)}</span><b>${x.tasks.filter(t=>t.done).length}/${x.tasks.length}</b></div>`}).join('');
}
function add(){const v=$('in').value.trim();if(!v)return;day(cur).tasks.push({id:Date.now(),text:v,done:false});$('in').value='';save();render()}
$('addb').onclick=add;
$('in').onkeydown=e=>{if(e.key==='Enter')add()};
document.body.addEventListener('click',e=>{
  const c=e.target.dataset;
  if(c.c){const t=day(cur).tasks.find(x=>x.id==c.c);t.done=!t.done;t.at=t.done?Date.now():null;save();render()}
  if(c.x){db[cur].tasks=db[cur].tasks.filter(x=>x.id!=c.x);save();render()}
  const h=e.target.closest('.h');if(h){cur=h.dataset.k;render();scrollTo({top:0,behavior:'smooth'})}
});
$('note').oninput=()=>{day(cur).note=$('note').value;save()};
$('prev').onclick=()=>{cur=shift(cur,-1);render()};
$('next').onclick=()=>{cur=shift(cur,1);render()};
$('carry').onclick=()=>{
  const prev=(db[shift(cur,-1)]||{tasks:[]}).tasks.filter(t=>!t.done);
  if(!prev.length){alert('Oldingi kundan bajarilmagan ish yoʻq');return}
  const d=day(cur);prev.forEach((t,i)=>{if(!d.tasks.some(x=>x.text===t.text))d.tasks.push({id:Date.now()+i,text:t.text,done:false})});save();render()
};
$('exp').onclick=()=>{
  const s=Object.keys(db).sort().map(k=>{const d=db[k];return long(k)+' '+k.slice(0,4)+'\n'+d.tasks.map(t=>(t.done?'[x] ':'[ ] ')+t.text).join('\n')+(d.note?'\nXulosa: '+d.note:'')}).join('\n\n');
  (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>alert('Nusxa olindi. Istalgan joyga qoʻyib saqlashingiz mumkin.')).catch(()=>alert('Nusxa olib boʻlmadi'));
};
render();
</script>
</body>
</html>
